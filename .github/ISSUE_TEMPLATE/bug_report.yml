name: Bug report
description: Report something that does not behave as documented — with evidence.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        ZeroCloud claims nothing without observed evidence, and bug reports are
        no exception. If it cannot be reproduced or measured yet, say so
        plainly rather than rounding up.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior, exactly as observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: The documented or intended behavior, with a link to the document or decision that specifies it where one exists.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Commands run, output, measurements, or CI links. Distinguish local test evidence from GitHub CI results and from production verification.
      render: text
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context
      description: Hardware, stage, branch, or document set involved — only what is relevant.
      placeholder: "e.g. Stage 0 docs, main branch"
  - type: checkboxes
    id: hygiene
    attributes:
      label: Report hygiene
      options:
        - label: This report contains no credentials, real personal records, or private infrastructure addresses.
          required: true
